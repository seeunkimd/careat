// 조리법에 따른 영양 손실 보정 계수 — 삶은 후 조리수를 버리는 방식(예: 삶은 감자, 수육)은
// 칼륨 등 수용성 영양소 일부가 조리수로 빠져나가는 것으로 알려져 있어 간이 보정치를 반영합니다.
// (국·탕·죽처럼 조리수를 그대로 섭취하는 메뉴는 보정하지 않습니다.)
const COOKING_LOSS_FACTORS = { potassiumMg: 0.85, sodiumMg: 0.9 };

function computeMealNutrition(meal, customIngredients) {
  const ingredients = customIngredients || meal.ingredients;
  const total = { totalWeightG: 0, energyKcal: 0, proteinG: 0, carbG: 0, fatG: 0, calciumMg: 0, ironMg: 0, potassiumMg: 0, sodiumMg: 0 };
  const rows = ingredients
    .filter(({ name }) => INGREDIENT_DB[name])
    .map(({ name, amountG }) => {
      const per100 = INGREDIENT_DB[name];
      const factor = amountG / 100;
      const contrib = {
        energyKcal: per100.energyKcal * factor, proteinG: per100.proteinG * factor,
        carbG: per100.carbG * factor, fatG: per100.fatG * factor,
        calciumMg: per100.calciumMg * factor, ironMg: per100.ironMg * factor,
        potassiumMg: per100.potassiumMg * factor, sodiumMg: per100.sodiumMg * factor,
      };
      total.totalWeightG += amountG;
      Object.keys(contrib).forEach((k) => (total[k] += contrib[k]));
      return { name, amountG, contrib };
    });
  const cookingAdjusted = !!(meal && meal.liquidDiscarded);
  if (cookingAdjusted) {
    total.potassiumMg *= COOKING_LOSS_FACTORS.potassiumMg;
    total.sodiumMg *= COOKING_LOSS_FACTORS.sodiumMg;
  }
  Object.keys(total).forEach((k) => { if (k !== "totalWeightG") total[k] = Math.round(total[k] * 10) / 10; });
  return { rows, total, cookingAdjusted };
}

// Harris-Benedict 공식으로 기초대사량(BEE)을 산정합니다.
function calcBEE(sex, weight, heightCm, age) {
  if (sex === "female") return 655 + 9.6 * weight + 1.8 * heightCm - 4.7 * age;
  return 66.5 + 13.7 * weight + 5.0 * heightCm - 6.8 * age;
}

// 1일 필요 에너지(kcal) = BEE × 활동계수 × 상해계수 (식사요법 교재 기준 계산식)
function getRange(weight, heightCm, age, sex, metabolicState) {
  const state = METABOLIC_STATES.find((s) => s.id === metabolicState);
  const bee = calcBEE(sex, weight, heightCm, age);
  const [aMin, aMax] = state.activityFactor;
  const [sMin, sMax] = state.stressFactor;
  const kcalMin = Math.round(bee * aMin * sMin);
  const kcalMax = Math.round(bee * aMax * sMax);
  const [pMin, pMax] = state.protein;
  return {
    bee: Math.round(bee),
    kcalMin, kcalMax, kcalMid: Math.round((kcalMin + kcalMax) / 2),
    proteinMin: +(weight * pMin).toFixed(0), proteinMax: +(weight * pMax).toFixed(0),
    state,
  };
}
function getFluidTarget(kcalMid) { return Math.round(kcalMid); }

const ROLE_ORDER = ["주식", "국물", "메인단백질", "곁들임"];
const ROLE_META = {
  주식: { label: "주식 (밥 · 죽류)", icon: Soup },
  국물: { label: "국물 (국 · 탕 · 스프)", icon: Droplets },

};

function getRequiredTags(symptomIds) {
  const req = new Set();
  symptomIds.forEach((id) => (SYMPTOM_REQUIREMENTS[id] || []).forEach((t) => req.add(t)));
  return [...req];
}

// 증상 조건을 만족하는 메뉴를, 역할(주식/국물/메인단백질/곁들임)별로 묶어서 추천합니다.
// 한 끼 식사가 식판처럼 여러 역할이 모여 완성되도록 구성하고, 역할마다 대안도 함께 보여줍니다.
function getRecommendedMeals(symptomIds, perRoleLimit = 3) {
  const requiredTags = getRequiredTags(symptomIds);
  const scored = MEALS.map((meal) => ({ meal, missing: requiredTags.filter((t) => !meal.tags[t]) }));

  const roles = ROLE_ORDER.map((role) => {
    const inRole = scored.filter((s) => s.meal.role === role).sort((a, b) => a.missing.length - b.missing.length);
    const fullMatches = inRole.filter((s) => s.missing.length === 0);
    const items = (fullMatches.length > 0 ? fullMatches : inRole).slice(0, perRoleLimit);
    return { role, allSatisfied: fullMatches.length > 0, items };
  }).filter((r) => r.items.length > 0);

  const allSatisfied = roles.every((r) => r.allSatisfied);
  return { requiredTags, allSatisfied, roles };
}

/* ============================================================
   실제 국가표준식품성분DB 연동
   ------------------------------------------------------------
   식품의약품안전처 식품안전나라 Open API(서비스ID: I2790, "식품영양성분DB")를
   실제로 호출한다. 이 서비스는 공공데이터포털에도 "식품의약품안전처_식품영양성분DB정보"
   로 등록되어 있으며, 개인이 무료로 발급받는 인증키(서비스키)로 호출한다.
   요청 형식: https://openapi.foodsafetykorea.go.kr/api/{인증키}/I2790/json/1/5/DESC_KOR={식품명}
   주의:
   - 브라우저(클라이언트)에서 직접 호출하면 이 API가 CORS 허용 헤더를 내려주지 않아
     대부분 실패한다. 실제 서비스에서는 백엔드 서버를 통해 우회 호출해야 한다.
   - 정확한 응답 필드명은 발급받은 키로 최초 호출한 뒤 실제 응답 구조를 보고 확정해야 하며,
     아래 파싱 로직은 공개된 문서에 근거한 예상 필드명(NUTR_CONT1~4 등)을 사용한다.
   ============================================================ */
function buildFoodApiUrl(apiKey, foodName) {
  return `https://openapi.foodsafetykorea.go.kr/api/${encodeURIComponent(apiKey)}/I2790/json/1/5/DESC_KOR=${encodeURIComponent(foodName)}`;
}

async function fetchRealNutrition(apiKey, foodName) {
  const url = buildFoodApiUrl(apiKey, foodName);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const body = data && data.I2790;
    if (!body) throw new Error("응답 형식을 확인할 수 없습니다.");
    if (body.RESULT && body.RESULT.CODE && body.RESULT.CODE !== "INFO-000") {
      throw new Error(body.RESULT.MSG || "조회 결과가 없습니다.");
    }
    const row = body.row && body.row[0];
    if (!row) throw new Error("일치하는 식품을 찾지 못했습니다.");
    return {
      ok: true,
      name: row.DESC_KOR,
      energyKcal: row.NUTR_CONT1,
      proteinG: row.NUTR_CONT2,
      fatG: row.NUTR_CONT3,
      carbG: row.NUTR_CONT4,
      servingSize: row.SERVING_SIZE,
      source: row.MAKER_NM || "식품의약품안전처",
    };
  } catch (err) {
    return { ok: false, error: err.message || "네트워크 오류로 DB 조회에 실패했습니다." };
  }
}

function OnCareTodayRx() {
  const [screen, setScreen] = useState("home");
  const [history, setHistory] = useState([]);
  const [mode, setMode] = useState(null);
  const [weight, setWeight] = useState("");
  const [height, setHeight] = useState("");
  const [age, setAge] = useState("");
  const [sex, setSex] = useState("female");
  const [weightChange, setWeightChange] = useState("");
  const [metabolicState, setMetabolicState] = useState("general");
  const [symptoms, setSymptoms] = useState([]);
  const [result, setResult] = useState(null);
  const [detailMeal, setDetailMeal] = useState(null);
  const [apiKey, setApiKey] = useState("");

  const navigate = (next) => {
    setHistory((h) => [...h, screen]);
    setScreen(next);
  };
  const goBack = () => {
    setHistory((h) => {
      if (h.length === 0) { setScreen("home"); return h; }
      const copy = [...h];
      const prev = copy.pop();
      setScreen(prev);
      return copy;
    });
  };
  const reset = () => {
    setMode(null); setWeight(""); setHeight(""); setAge(""); setSex("female"); setWeightChange(""); setMetabolicState("general");
    setSymptoms([]); setResult(null); setDetailMeal(null); setHistory([]); setScreen("home");
  };

  const toggleSymptom = (id) => setSymptoms((prev) => (prev.includes(id) ? prev.filter((s) => s !== id) : [...prev, id]));

  const selectMode = (m) => { setMode(m); navigate("patientInfo"); };

  const computeAndGo = (nextScreen) => {
    const w = parseFloat(weight);
    const h = parseFloat(height);
    const a = parseFloat(age);
    const range = getRange(w, h, a, sex, metabolicState);
    const fluid = getFluidTarget(range.kcalMid);
    const kgLost = parseFloat(weightChange);
    const lossPct = !isNaN(kgLost) && w > 0 ? (kgLost / w) * 100 : 0;
    const severeLoss = !isNaN(kgLost) && kgLost > 0 && lossPct >= 5;
    const mealRec = mode === "care" ? getRecommendedMeals(symptoms, 3) : null;
    setResult({ range, fluid, severeLoss, lossPct, mealRec });
    navigate(nextScreen);
  };

  const showFoodDetail = (meal) => { setDetailMeal(meal); navigate("foodDetail"); };

  const handleNavBar = (id) => {
    if (id === "home") { setHistory([]); setScreen("home"); return; }
    if (id === "flow") {
      if (!mode) { setHistory([]); setScreen("home"); return; }
      setHistory([]); setScreen("patientInfo"); return;
    }
    if (id === "foodBrowse") { setHistory([]); setScreen("foodBrowse"); return; }
    if (id === "myPage") { setHistory([]); setScreen("myPage"); return; }
  };

  let content;
  if (screen === "home") content = <HomeScreen onSelectMode={selectMode} onNavigate={navigate} />;
  else if (screen === "about") content = <AboutScreen onBack={goBack} />;
  else if (screen === "dbFlow") content = <DbFlowScreen onBack={goBack} />;
  else if (screen === "patientInfo")
    content = (
      <PatientInfoScreen
        weight={weight} setWeight={setWeight}
        height={height} setHeight={setHeight}
        age={age} setAge={setAge}
        sex={sex} setSex={setSex}
        weightChange={weightChange} setWeightChange={setWeightChange}
        metabolicState={metabolicState} setMetabolicState={setMetabolicState}
        onNext={() => navigate("symptoms")}
        onBack={goBack}
      />
    );
  else if (screen === "symptoms")
    content = <SymptomsScreen symptoms={symptoms} toggleSymptom={toggleSymptom} onNext={() => computeAndGo("result")} onBack={goBack} />;
  else if (screen === "result")
    content = (
      <ResultScreen
        weight={weight} weightChange={weightChange} metabolicState={metabolicState} symptoms={symptoms}
        result={result} onNext={() => navigate("meals")} onBack={goBack}
      />
    );
  else if (screen === "meals")
    content = <MealsScreen symptoms={symptoms} result={result} onShowDetail={showFoodDetail} onBack={goBack} />;
  else if (screen === "foodDetail")
    content = <FoodDetailScreen meal={detailMeal} onBack={goBack} apiKey={apiKey} onOpenSettings={() => navigate("dbSettings")} />;
  else if (screen === "foodBrowse")
    content = <FoodBrowseScreen onShowDetail={showFoodDetail} />;
  else if (screen === "myPage")
    content = <MyPageScreen apiKey={apiKey} onOpenSettings={() => navigate("dbSettings")} />;
  else if (screen === "dbSettings")
    content = <DbSettingsScreen apiKey={apiKey} setApiKey={setApiKey} onBack={goBack} />;

  return (
    <div className="min-h-screen bg-stone-50 text-stone-800">
      <NavBar variant="top" active={screen} onNavigate={handleNavBar} />
      <div className="flex items-center justify-between px-4 pt-4 sm:hidden">
        <div className="font-bold text-teal-700">케어잇</div>
        <button onClick={reset} className="flex items-center gap-1 text-xs text-stone-400">
          <RotateCcw className="w-3.5 h-3.5" /> 처음부터
        </button>
      </div>
      <div className="hidden sm:flex justify-end px-6 pt-3">
        <button onClick={reset} className="flex items-center gap-1 text-xs text-stone-400 hover:text-stone-600">
          <RotateCcw className="w-3.5 h-3.5" /> 처음부터
        </button>
      </div>
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6 pb-24 sm:pb-10">
        {content}
      </div>
      <NavBar variant="bottom" active={screen} onNavigate={handleNavBar} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OnCareTodayRx />);

</script>
